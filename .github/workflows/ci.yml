name: ci
on: [push, pull_request]
# Actions are pinned to the commit of a release (a tag can be moved); the comment names the release.
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run mypy --strict src
      - run: uv run pytest -q
      # Dependency vulnerability scan against the committed lockfile. The node package (../node) is a local path dependency
      # with no dependencies of its own; pip-audit cannot read a path requirement, so local packages are left out.
      - run: uvx pip-audit --strict --disable-pip --no-deps -r <(uv export --frozen --no-hashes --no-emit-project --no-emit-local)
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: npm test
