[package]
name = "ec-engines-wasm"
description = "The browser's copy of Engine Console's engine adapters: ec-engines compiled to wasm32 behind a JSON-in, JSON-out API for frontend/js/engines-wasm.js (`make wasm` builds frontend/pkg/)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib: the .wasm `make wasm` builds; rlib: the native unit tests of the exports (cargo test runs them on the host)
crate-type = ["cdylib", "rlib"]

[dependencies]
ec-engines.workspace = true
ec-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
# The exact version of the wasm-bindgen CLI that generates the JS glue (`make wasm` refuses a different CLI): the two
# must match. 0.2.129 is the version harness2-workbench vetted, past the 14-day cooldown.
wasm-bindgen = "=0.2.129"

[lints]
workspace = true
