[package]
name = "ec-hub"
description = "Engine Console hub (port of backend/src/engine_console): HTTP API + UI server and the engine-console CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "engine-console"
path = "src/main.rs"

[dependencies]
ec-proto = { workspace = true, features = ["tokio"] }
anyhow.workspace = true
